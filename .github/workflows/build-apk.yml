name: Construir APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar aplicación web
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          node android/scripts/prepare-performance.cjs android/app/src/main/assets/index.html
          node android/scripts/prepare-offline.cjs android/app/src/main/assets/index.html
          mkdir -p android/app/src/main/assets/vendor
          curl -fsSL --retry 3 https://cdn.tailwindcss.com -o android/app/src/main/assets/vendor/tailwindcss.js
          curl -fsSL --retry 3 https://unpkg.com/lucide@latest -o android/app/src/main/assets/vendor/lucide.js
          curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/chart.js -o android/app/src/main/assets/vendor/chart.js
          curl -fsSL --retry 3 https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js -o android/app/src/main/assets/vendor/jspdf.umd.min.js
          curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js -o android/app/src/main/assets/vendor/xlsx.bundle.js
          curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2 -o android/app/src/main/assets/vendor/supabase.js
          sed -i 's#https://cdn.tailwindcss.com#vendor/tailwindcss.js#g' android/app/src/main/assets/index.html
          sed -i 's#https://unpkg.com/lucide@latest#vendor/lucide.js#g' android/app/src/main/assets/index.html
          sed -i 's#https://cdn.jsdelivr.net/npm/chart.js#vendor/chart.js#g' android/app/src/main/assets/index.html
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js#vendor/jspdf.umd.min.js#g' android/app/src/main/assets/index.html
          sed -i 's#https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js#vendor/xlsx.bundle.js#g' android/app/src/main/assets/index.html
          sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2#vendor/supabase.js#g' android/app/src/main/assets/index.html
      - name: Compilar APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ERP-Materiales-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
