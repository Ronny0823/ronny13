name: Construir APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'organized/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar aplicación web organizada
        run: |
          mkdir -p android/app/src/main/assets
          cp organized/index.html android/app/src/main/assets/index.html
          cp -R organized/css android/app/src/main/assets/
          cp -R organized/js android/app/src/main/assets/
          cp -R organized/assets android/app/src/main/assets/
          node android/scripts/prepare-offline.cjs android/app/src/main/assets/js/app.js
          mkdir -p android/app/src/main/assets/vendor
          curl -fsSL --retry 3 https://cdn.tailwindcss.com -o android/app/src/main/assets/vendor/tailwindcss.js
          curl -fsSL --retry 3 https://unpkg.com/lucide@0.468.0 -o android/app/src/main/assets/vendor/lucide.js
          curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/chart.js@4.4.7 -o android/app/src/main/assets/vendor/chart.js
          curl -fsSL --retry 3 https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js -o android/app/src/main/assets/vendor/jspdf.umd.min.js
          curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js -o android/app/src/main/assets/vendor/xlsx.bundle.js
          curl -fsSL --retry 3 https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10 -o android/app/src/main/assets/vendor/supabase.js
          sed -i 's#https://cdn.tailwindcss.com#vendor/tailwindcss.js#g' android/app/src/main/assets/index.html
          sed -i 's#https://unpkg.com/lucide@0.468.0#vendor/lucide.js#g' android/app/src/main/assets/index.html
          sed -i 's#https://cdn.jsdelivr.net/npm/chart.js@4.4.7#vendor/chart.js#g' android/app/src/main/assets/index.html
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js#vendor/jspdf.umd.min.js#g' android/app/src/main/assets/index.html
          sed -i 's#https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js#vendor/xlsx.bundle.js#g' android/app/src/main/assets/index.html
          sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10#vendor/supabase.js#g' android/app/src/main/assets/index.html
          grep -q 'src="vendor/lucide.js"' android/app/src/main/assets/index.html
          grep -q 'src="vendor/chart.js"' android/app/src/main/assets/index.html
          grep -q 'src="vendor/supabase.js"' android/app/src/main/assets/index.html
          test "$(wc -c < android/app/src/main/assets/vendor/supabase.js)" -gt 100000
          grep -q 'createClient' android/app/src/main/assets/vendor/supabase.js
          test "$(wc -c < android/app/src/main/assets/assets/fonts/LiberationSans-Regular.ttf)" -gt 300000
          test "$(wc -c < android/app/src/main/assets/assets/fonts/LiberationSans-Bold.ttf)" -gt 300000
          if grep -Eq 'src="https://[^"]*(lucide|chart\.js|supabase-js)' android/app/src/main/assets/index.html; then
            echo "Quedaron librerías críticas apuntando a internet"
            exit 1
          fi
      - name: Verificar aplicación
        run: |
          node --check organized/js/app.js
          node --check organized/js/quotations.js
          node --check organized/js/sale-invoice.js
          node --check organized/js/fuel-receipt.js
          node --check organized/js/trip-receipt.js
          node --check organized/js/credit-receipt.js
          node tools/verify-fuel-receipt.cjs
          node tools/verify-trip-receipt.cjs
          node tools/verify-trip-number.cjs
          node tools/verify-credit-receipt.cjs
          node tools/verify-credit-payment-print.cjs
          node tools/verify-app.cjs
      - name: Preparar firma permanente
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: erp_materiales_release
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/erp-materiales-release.p12"; then
            echo "::error::La llave de firma no se pudo decodificar"
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/erp-materiales-release.p12" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias erp_materiales_release >/dev/null; then
            echo "::error::La llave o su contraseña no coinciden"
            exit 1
          fi
      - name: Compilar APK firmada
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/erp-materiales-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: erp_materiales_release
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Preparar APK directo
        run: cp android/app/build/outputs/apk/release/app-release.apk ERP-Materiales-v1.91-Pago-Total-Corregido.apk
      - name: Publicar APK en descarga web
        run: |
          mkdir -p downloads
          cp ERP-Materiales-v1.91-Pago-Total-Corregido.apk downloads/ERP-Materiales-v1.91-Pago-Total-Corregido.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/ERP-Materiales-v1.91-Pago-Total-Corregido.apk
          if git diff --cached --quiet; then
            echo "La APK web ya estaba actualizada"
          else
            git commit -m "Publicar descarga web APK v1.91"
            git push origin HEAD:main
          fi
      - name: Verificar firma de la APK
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs ERP-Materiales-v1.91-Pago-Total-Corregido.apk
          CERT_SHA256="$("$APKSIGNER" verify --print-certs ERP-Materiales-v1.91-Pago-Total-Corregido.apk | sed -n 's/^.*Signer: certificate SHA-256 digest: //p' | head -1)"
          test "$CERT_SHA256" = "ccb3a55a3c1f97bc16badba3363299c65ff6b453212b983d59321348a223b44b"
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ERP-Materiales-APK
          path: ERP-Materiales-v1.91-Pago-Total-Corregido.apk
      - name: Publicar descarga directa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.91
          name: ERP Materiales v1.91
          files: ERP-Materiales-v1.91-Pago-Total-Corregido.apk
          overwrite_files: true
