plugins { id 'com.android.application' }

android {
    namespace 'com.ronny.erpmaterialesnorte'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ronny.erpmaterialesnorte'
        minSdk 24
        targetSdk 35
        versionCode 13
        versionName '1.12.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
